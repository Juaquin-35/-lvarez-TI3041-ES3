{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Formulario de Contacto / Consultas</h2>
    <p class="text-muted">Has visitado esta sección {{ visitas }} vez/veces en esta sesión.</p>
    
    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar Consulta</button>
    </form>
</div>
{% endblock %}
